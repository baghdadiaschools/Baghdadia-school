services:
  - type: web
    name: baghdadia-school
    runtime: node
    plan: free
    branch: feat/baghdadia-school-app
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
